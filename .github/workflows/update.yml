name: Atnaujinti tvarkarasti

on:
  schedule:
    - cron: "17 */6 * * *"   # kas 6 val. (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generuoti .ics is EduPage
        run: python gen_ics_edupage.py
      - name: Pazymeti patikros laika
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > last_check.txt
      - name: Commit ir push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Pakeitimu nera"; else git commit -m "Atnaujinta $(date -u +'%Y-%m-%d %H:%M') UTC"; git push; fi
